[package]
name = "agentplug-treesitter"
version = "0.1.1"
edition = "2021"

[lib]
name = "agentplug_treesitter"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-md = "0.5"

[target.wasm32-wasip1.dependencies]
tree-sitter-c-sharp = "0.23.5"
tree-sitter-haskell = "0.23.1"
tree-sitter-julia = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-yaml = "0.7"
tree-sitter-lua = "0.4"
tree-sitter-kotlin-ng = "1"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.24"
tree-sitter-xml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-zig = "1"
tree-sitter-elixir = "0.3"
tree-sitter-perl = "1"
tree-sitter-r = "1.3"
tree-sitter-objc = "3"
tree-sitter-graphql = "0.1"
tree-sitter-proto = "0.4"
tree-sitter-containerfile = "0.9"
