name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agentplug-treesitter-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      wasm_artifact_name: agentplug_treesitter.wasm
      published_asset_basename: treesitter
      release_repo: AnEntrypoint/agentplug-treesitter-bin
      release_title_prefix: agentplug-treesitter
      pre_build_steps: |
        curl -L -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
        tar xzf wasi-sdk.tar.gz
        echo "WASI_SDK_PATH=$PWD/wasi-sdk-24.0-x86_64-linux" >> "$GITHUB_ENV"
      build_env: |
        export CC_wasm32_wasip1="$WASI_SDK_PATH/bin/clang"
        export CFLAGS_wasm32_wasip1="--sysroot=$WASI_SDK_PATH/share/wasi-sysroot"
      build_command: cargo build --release --target wasm32-wasip1 -j 2
      npm_package_name: agentplug-treesitter-wasm
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
      npm_token: ${{ secrets.NPM_TOKEN }}
